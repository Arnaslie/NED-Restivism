name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check service worker app shell
        run: node scripts/check-shell.mjs

      # Publish only the app. docs/, scripts/, .github/ and anything else stay out of the site.
      - name: Stage app files
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R src icons mock _site/
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
