<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Security (infra-owned, see docs/decisions/0004). Static hosting cannot set headers, so CSP is a meta tag.
         No inline scripts/styles or style="" attributes; everything loads from same-origin files. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6feb" />
    <meta name="description" content="NED-Restivism" />
    <title>NED-Restivism</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1 id="app-name"></h1>
    </header>
    <nav id="nav" class="app-nav" hidden></nav>
    <main id="view" tabindex="-1"></main>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
